name: Arma 3 Mission Validation

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Arma 3 Mission
    runs-on: windows-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ---------------------------------------------------------
      # Install SQFLint
      # ---------------------------------------------------------
      - name: Install SQFLint
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install sqflint

      # ---------------------------------------------------------
      # Find files that need checking
      #
      # Pull requests:
      #   Only changed SQF/HPP/EXT/config files are checked.
      #
      # Pushes to main / manual runs:
      #   The entire repository is checked.
      # ---------------------------------------------------------
      - name: Find files to validate
        id: files
        shell: powershell
        run: |

          $files = @()

          if ("${{ github.event_name }}" -eq "pull_request") {

              Write-Host "Pull request detected."
              Write-Host "Finding changed Arma files..."

              $base = "${{ github.event.pull_request.base.sha }}"
              $head = "${{ github.event.pull_request.head.sha }}"

              $changed = git diff --name-only $base $head

              foreach ($file in $changed) {
                  if (
                      $file -match '\.sqf$' -or
                      $file -match '\.hpp$' -or
                      $file -match '\.ext$' -or
                      $file -match '(^|/)description\.ext$' -or
                      $file -match '(^|/)config\.cpp$' -or
                      $file -match '(^|/)CfgFunctions\.hpp$' -or
                      $file -match '(^|/)xeh_PreInit_EH\.hpp$' -or
                      $file -match '(^|/)cfgMRH_SoldierTabData\.hpp$' -or
                      $file -match '(^|/)cfgMRH_SoldierTabIntelPictures.hpp\.hpp$'
                  ) {
                      $files += $file
                  }
              }

          } else {

              Write-Host "Full repository validation."

              $files = Get-ChildItem -Recurse -File |
                  Where-Object {
                      $_.FullName -notmatch '\\.git\\' -and
                      (
                          $_.Extension -ieq ".sqf" -or
                          $_.Extension -ieq ".hpp" -or
                          $_.Extension -ieq ".ext" -or
                          $_.Name -ieq "description.ext" -or
                          $_.Name -ieq "config.cpp" -or
                          $_.Name -ieq "CfgFunctions.hpp" -or
                          $_.Name -ieq "xeh_PreInit_EH.hpp" -or
                          $_.Name -ieq "cfgMRH_SoldierTabData.hpp" or
                          $_.Name -ieq "cfgMRH_SoldierTabIntelPictures.hpp"
                      )
                  } |
                  ForEach-Object {
                      $_.FullName
                  }
          }

          if ($files.Count -eq 0) {

              Write-Host "No Arma files need validation."

              "has_files=false" >> $env:GITHUB_OUTPUT

          } else {

              Write-Host ""
              Write-Host "Files to validate:"
              $files | ForEach-Object {
                  Write-Host "  $_"
              }

              "has_files=true" >> $env:GITHUB_OUTPUT

              # Save paths for later steps.
              $files | Out-File `
                  -FilePath "$env:GITHUB_WORKSPACE\validation-files.txt" `
                  -Encoding utf8
          }

      # ---------------------------------------------------------
      # SQFLint
      # ---------------------------------------------------------
      - name: Validate SQF
        if: steps.files.outputs.has_files == 'true'
        shell: powershell
        run: |

          $failed = $false

          $files = Get-Content `
              "$env:GITHUB_WORKSPACE\validation-files.txt"

          foreach ($file in $files) {

              if (-not ($file -match '\.sqf$')) {
                  continue
              }

              Write-Host ""
              Write-Host "========================================"
              Write-Host "SQFLint: $file"
              Write-Host "========================================"

              $output = python -m sqflint "$file" 2>&1

              $exitCode = $LASTEXITCODE

              $output | ForEach-Object {
                  Write-Host $_
              }

              if ($exitCode -ne 0) {

                  $failed = $true

                  # Try to turn common SQFLint output into
                  # GitHub annotations.
                  foreach ($line in $output) {

                      if (
                          $line -match
                          '^(.*?):(\d+)(?::(\d+))?:\s*(.*)$'
                      ) {

                          $path = $Matches[1]
                          $lineNumber = $Matches[2]
                          $column = $Matches[3]
                          $message = $Matches[4]

                          if ($column) {

                              Write-Host "::error file=$path,line=$lineNumber,col=$column::$message"

                          } else {

                              Write-Host "::error file=$path,line=$lineNumber::$message"
                          }
                      }
                  }
              }
          }

          if ($failed) {

              Write-Error "SQFLint found one or more errors."

              exit 1
          }

      # ---------------------------------------------------------
      # Config / HPP / EXT validation
      # ---------------------------------------------------------
      - name: Validate Arma config files
        if: steps.files.outputs.has_files == 'true'
        shell: powershell
        run: |

          python tools\validate_arma_config.py `
              --file-list validation-files.txt

      # ---------------------------------------------------------
      # Final summary
      # ---------------------------------------------------------
      - name: Validation successful
        if: success()
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host " ARMA 3 VALIDATION PASSED"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "SQF syntax ............. PASS"
          Write-Host "Config/HPP structure .. PASS"
          Write-Host "description.ext ....... PASS"
          Write-Host "config.cpp ............ PASS"
          Write-Host ""
          Write-Host "No validation errors were found."